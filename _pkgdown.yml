url: https://animovement.dev/anicore/
home:
  title: "anicore – An R package providing core data structures for movement data"

# Shared navbar (incl. the animovement dropdown + Zulip), theme, and author
# details are inherited from animovementtemplate.
template:
  bootstrap: 5
  package: animovementtemplate
  bslib:
    primary: "#175449"

articles:
  - title: "Get started"
    navbar: ~
    contents:
      - articles/aniframe-structure
      - articles/aniframe-metadata
      - articles/structures
      - articles/anievent-structure

reference:
  - title: "Creating and converting anipoint objects"
    desc: >
      Functions that create an anipoint (the position-grain frame), coerce
      other objects to anipoint, or provide example data. `aniframe` is
      the abstract parent class shared by anipoint and anievent.
    contents:
      - as_anipoint
      - anipoint
      - example_anipoint
      - is_anipoint
      - ensure_is_anipoint
      - is_aniframe
      - ensure_is_aniframe
      - validate_anipoint
      - anicore-deprecated

  - title: "Creating and converting anievent objects"
    desc: >
      Functions that create an anievent (long-format behavioural event
      records) or coerce other objects to anievent.
    contents:
      - to_anievent
      - as_anievent
      - anievent
      - is_anievent
      - ensure_is_anievent
      - validate_anievent

  - title: "Metadata"
    desc: >
      Read and declare metadata. `set_*` only declares; it never changes a
      value.
    contents:
      - get_metadata
      - set_metadata
      - list_default_metadata
      - get_sampling_interval
      - is_sampling_regular
      - get_axis_directions
      - set_axis_directions
      - get_angle_direction
      - get_handedness
      - get_coordinate_system

  - title: "Declaring variables"
    desc: >
      Declare which columns carry identity, time, position and events. The
      setters restructure the frame to match, so `set_metadata()` refuses
      these fields.
    contents:
      - variables
      - get_keys
      - get_index
      - set_index
      - get_axes

  - title: "Transforming values"
    desc: >
      Functions that change values and update the metadata to match.
    contents:
      - convert_unit_space
      - convert_unit_time
      - convert_unit_angle
      - reflect_axis

  - title: "Structures"
    desc: >
      Points, the segments between them, and joints, over the levels of an
      identity or temporal variable. A frame can hold several named
      structures.
    contents:
      - anistructure
      - example_structure
      - validate_anistructure
      - is_anistructure
      - structures

  - title: "Segments"
    desc: >
      The same data re-expressed per segment: a length and a unit direction,
      converted from and back to an anipoint.
    contents:
      - as_anisegment
      - is_anisegment

  - title: "Joints"
    desc: >
      One angle per joint, computed from its two segments.
    contents:
      - as_anijoint
      - is_anijoint

  - title: "Spatial checks"
    desc: |
      These functions provide checks for your coordinate system.
      `is_spatial()` and `ensure_is_spatial()` check that the declared
      position columns are present and numeric; the `is_cartesian*()`
      family reports which coordinate system the frame is in, which follows
      from the axis roles it declares.
    contents:
    - is_spatial
    - ensure_is_spatial
    - is_cartesian
    - is_cartesian_1d
    - is_cartesian_2d
    - is_cartesian_3d
    - is_polar
    - is_cylindrical
    - is_spherical
    - ensure_is_cartesian
    - ensure_is_cartesian_1d
    - ensure_is_cartesian_2d
    - ensure_is_cartesian_3d
    - ensure_is_polar
    - ensure_is_cylindrical
    - ensure_is_spherical

  - title: "Angles"
    desc: >
      Two families, and the difference matters. `*_angle()` and the `x_to_y()`
      conversions manipulate how an angle is written. The `circ_*()` functions
      compute with the wraparound: an ordinary mean or median of angles gives
      the wrong answer, since the mean of 350 and 10 degrees is 0, not 180.

  - subtitle: "Handling angles"
    contents:
    - rad_to_deg
    - deg_to_rad
    - wrap_angle
    - unwrap_angle
    - angle_between

  - subtitle: "Circular statistics"
    contents:
    - circ_difference
    - circ_successive_difference
    - circ_mean
    - circ_median
    - circ_sd
    - circ_mad

  - title: "Helpers"
    desc:
    contents:
    - convert_nan_to_na
    - convert_inf_to_na

