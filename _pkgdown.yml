url: https://animovement.dev/anicore/
home:
  title: "anicore – An R package providing core data structures for movement data"

# Shared navbar (incl. the animovement dropdown + Zulip), theme, and author
# details are inherited from animovementtemplate.
template:
  bootstrap: 5
  package: animovementtemplate
  bslib:
    primary: "#175449"

articles:
  - title: "Get started"
    navbar: ~
    contents:
      - articles/aniframe-structure
      - articles/aniframe-metadata
      - articles/aniframe-connections
      - articles/anievent-structure

reference:
  - title: "Creating and converting anipoint objects"
    desc: >
      Functions that create an anipoint (the position-grain frame), coerce
      other objects to anipoint, or provide example data. `aniframe` is
      the abstract parent class shared by anipoint and anievent.
    contents:
      - as_anipoint
      - anipoint
      - example_anipoint
      - is_anipoint
      - ensure_is_anipoint
      - is_aniframe
      - ensure_is_aniframe
      - validate_anipoint
      - anicore-deprecated

  - title: "Creating and converting anievent objects"
    desc: >
      Functions that create an anievent (long-format behavioural event
      records) or coerce other objects to anievent.
    contents:
      - to_anievent
      - as_anievent
      - anievent
      - is_anievent
      - ensure_is_anievent
      - validate_anievent

  - title: "Metadata handling"
    desc: >
      Functions for reading, setting, and retrieving the metadata
      attached to aniframe or anievent objects.
    contents:
      - get_metadata
      - set_metadata
      - get_unit_time
      - set_unit_time
      - get_unit_space
      - set_unit_space
      - get_unit_angle
      - set_unit_angle
      - get_sampling_rate
      - set_sampling_rate
      - get_sampling_interval
      - is_sampling_regular
      - get_axis_directions
      - set_axis_directions
      - get_axis_extents
      - set_axis_extents
      - get_angle_direction
      - set_angle_direction
      - get_handedness
      - set_handedness
      - list_default_metadata

  - title: "Declaring variables"
    desc: >
      Declare which columns carry identity, time and position. These are
      the frame's structure rather than a description of it, so the
      setters restructure the frame to match — coercing column types,
      relocating, reordering, regrouping, and refreshing derived fields.
      `set_metadata()` refuses these fields for that reason.
    contents:
      - variables
      - variables_event
      - get_index
      - set_index
      - get_axes
      - set_axes
      - get_coordinate_system

  - title: "Connections"
    desc: >
      Manage connections between identity or temporal variables (e.g.
      skeleton edges between keypoints, or social-network edges between
      individuals). Stored as a named list of `from`/`to` tibbles in
      `metadata$connections`.
    contents:
      - set_connections
      - get_connections
      - add_connections
      - remove_connections

  - title: "Spatial checks"
    desc: |
      These functions provide checks for your coordinate system.
      `is_spatial()` and `ensure_is_spatial()` check that the columns named
      in `variables_where` are present and numeric; the `is_cartesian*()`
      family reports which coordinate system the frame is in, which follows
      from the axis roles it declares.
    contents:
    - is_spatial
    - ensure_is_spatial
    - is_cartesian
    - is_cartesian_1d
    - is_cartesian_2d
    - is_cartesian_3d
    - is_polar
    - is_cylindrical
    - is_spherical
    - ensure_is_cartesian
    - ensure_is_cartesian_1d
    - ensure_is_cartesian_2d
    - ensure_is_cartesian_3d
    - ensure_is_polar
    - ensure_is_cylindrical
    - ensure_is_spherical

  - title: "Angles"
    desc: >
      Two families, and the difference matters. `*_angle()` and the `x_to_y()`
      conversions manipulate how an angle is written. The `circ_*()` functions
      compute with the wraparound: an ordinary mean or median of angles gives
      the wrong answer, since the mean of 350 and 10 degrees is 0, not 180.

  - subtitle: "Handling angles"
    contents:
    - rad_to_deg
    - deg_to_rad
    - wrap_angle
    - unwrap_angle

  - subtitle: "Circular statistics"
    contents:
    - circ_difference
    - circ_successive_difference
    - circ_mean
    - circ_median
    - circ_sd
    - circ_mad

  - title: "Helpers"
    desc:
    contents:
    - convert_nan_to_na
    - convert_inf_to_na

